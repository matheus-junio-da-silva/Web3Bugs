name: cvl2-ledger-integrity

on:
  pull_request:
    paths:
      - 'Web3Bugs-certora/docs/cvl2/coordination/**'
      - 'Web3Bugs-certora/scripts/check_cvl2_round*_progress.py'
      - 'Web3Bugs-certora/scripts/check_cvl2_round8_attempts.py'
      - '.github/workflows/cvl2-ledger-integrity.yml'
  push:
    branches: [main]
    paths:
      - 'Web3Bugs-certora/docs/cvl2/coordination/**'
      - 'Web3Bugs-certora/scripts/check_cvl2_round*_progress.py'
      - 'Web3Bugs-certora/scripts/check_cvl2_round8_attempts.py'
      - '.github/workflows/cvl2-ledger-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Original catalog structural validators
        working-directory: Web3Bugs-certora
        run: |
          python scripts/check_specs.py .
          python scripts/check_contests_csv.py .
          python scripts/check_contracts.py .
      - name: Independently recompute every ledger
        working-directory: Web3Bugs-certora
        run: |
          python scripts/check_cvl2_round4_progress.py --json
          python scripts/check_cvl2_round5_progress.py
          python scripts/check_cvl2_round6_progress.py
          python scripts/check_cvl2_round7_progress.py
          python scripts/check_cvl2_round8_attempts.py
      - name: Round 7 negative test rejects a fabricated result
        working-directory: Web3Bugs-certora
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv, subprocess, tempfile, sys
          src = Path("docs/cvl2/coordination/ROUND7_PROGRESS.csv")
          with src.open(newline="", encoding="utf-8") as f:
              reader = csv.DictReader(f)
              rows, fields = list(reader), reader.fieldnames
          assert len(rows) == 23
          rows[0]["limited_cvl2_compile_ok"] = str(int(rows[0]["limited_cvl2_compile_ok"]) + 1)
          with tempfile.TemporaryDirectory(prefix="cvl2-negative-") as d:
              bad = Path(d) / "invalid.csv"
              with bad.open("w", newline="", encoding="utf-8") as f:
                  writer = csv.DictWriter(f, fieldnames=fields)
                  writer.writeheader()
                  writer.writerows(rows)
              result = subprocess.run([
                  sys.executable, "scripts/check_cvl2_round7_progress.py",
                  "--ledger", str(bad)
              ], capture_output=True, text=True, timeout=30)
              print(result.stdout)
              assert result.returncode == 1, f"Expected fail-closed, got {result.returncode}: {result.stderr}"
              assert "errors" in result.stdout and "limited_cvl2_compile_ok" in result.stdout
          PY
      - name: Round 8 negative test rejects unproven semantic promotion
        working-directory: Web3Bugs-certora
        run: |
          python - <<'PY'
          import csv, subprocess, tempfile, sys
          from pathlib import Path
          with Path("docs/cvl2/coordination/ROUND8_COMPILATION_ATTEMPTS.csv").open(newline="") as f:
              r = csv.DictReader(f)
              rows, cols = list(r), r.fieldnames
          assert len(rows) == 18
          rows[-1]["semantic_equivalence"] = "PROVEN"
          with tempfile.TemporaryDirectory() as d:
              bad = Path(d) / "fake.csv"
              with bad.open("w", newline="") as f:
                  w = csv.DictWriter(f, fieldnames=cols)
                  w.writeheader()
                  w.writerows(rows)
              out = subprocess.run([sys.executable, "scripts/check_cvl2_round8_attempts.py",
                                    "--attempts", str(bad)],
                                   text=True, capture_output=True, timeout=30)
              print(out.stdout)
              assert out.returncode == 1, out.stderr
              assert "unsupported semantic promotion" in out.stdout
          PY
