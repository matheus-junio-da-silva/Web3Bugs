name: HELIX Project 15 Catalog Validation
on:
  push:
    branches:
      - catalog/p15-helix-aave-proof-of-reserve
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate Project 15, without overwriting other projects
        run: |
          mkdir -p /tmp/p15-validation
          python .github/scripts/p15_generate_catalog.py 2>&1 | tee /tmp/p15-validation/generate.log
      - name: Commit generated catalog locally
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Web3Bugs-certora/.gitattributes Web3Bugs-certora/contracts/15 \
            Web3Bugs-certora/resources/15 Web3Bugs-certora/reports/15.md \
            Web3Bugs-certora/docs/spec_catalog_project_15.md \
            Web3Bugs-certora/results/spec/incomplete/15 \
            Web3Bugs-certora/results/spec/spec_buglabel.csv Web3Bugs-certora/results/contests.csv
          git commit -m "feat(p15): catalog 15 historical AAVE Proof of Reserve properties"
      - name: Run exact official checks and save actual exit codes
        id: validation
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/p15-validation
          git fetch origin main
          cd Web3Bugs-certora
          python scripts/check_specs.py . > /tmp/p15-validation/check_specs.log 2>&1; a=$?
          python scripts/check_contests_csv.py . > /tmp/p15-validation/check_contests_csv.log 2>&1; b=$?
          python scripts/check_contracts.py . > /tmp/p15-validation/check_contracts.log 2>&1; c=$?
          cd ..
          git -c core.whitespace=cr-at-eol diff --check origin/main...HEAD > /tmp/p15-validation/git_diff_check.log 2>&1; d=$?
          echo "HEAD=$(git rev-parse HEAD)" | tee /tmp/p15-validation/summary.log
          echo "origin/main=$(git rev-parse origin/main)" | tee -a /tmp/p15-validation/summary.log
          echo "check_specs=$a check_contests_csv=$b check_contracts=$c git_diff_check=$d" | tee -a /tmp/p15-validation/summary.log
          for f in /tmp/p15-validation/*.log; do echo "----- $f"; cat "$f"; done
          if [ "$a" -eq 0 ] && [ "$b" -eq 0 ] && [ "$c" -eq 0 ] && [ "$d" -eq 0 ]; then
            echo "all_passed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "all_passed=false" >> "$GITHUB_OUTPUT"
          exit 1
      - name: Publish validated commit to branch (never main)
        if: steps.validation.outputs.all_passed == 'true'
        run: git push origin HEAD:refs/heads/catalog/p15-helix-aave-proof-of-reserve
      - name: Archive logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: helix-p15-validation
          path: /tmp/p15-validation/
          if-no-files-found: warn
