name: P23 Radicle historical report inspect (temporary)
on:
  push:
    branches: [catalog/p23-delta-radicle-drips]
jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Read exact historical report text
        run: |
          git clone --depth=1 https://github.com/matheus-junio-da-silva/PropertyGPT.git source
          test "$(git -C source rev-parse HEAD)" = "687f654c679ed45ab127b7949e2a29c8f5e491b9"
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils >/dev/null
          pdftotext -layout source/certora_projects/radicle_drips/Formal_Verification_Report_of_Radicle_Drips_Contracts.pdf report.txt
          echo '=== PDF REPORT START ==='
          cat report.txt
          echo '=== PDF REPORT END ==='
